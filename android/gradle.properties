org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
# Kotlin's ABI validation (checkKotlinAbi) reads the Kotlin Android plugin's compilations, which AGP's built-in
# Kotlin doesn't create: with it the check fails with "no value available". AGP 10 removes this setting, so
# move to built-in Kotlin once ABI validation supports it.
android.builtInKotlin=false
android.newDsl=false
