[versions]
agp = "9.5.1"
kotlin = "2.4.21"
# The oldest versions the agent works with. Apps add it to debug builds only, so anything newer
# would make their debug build resolve different libraries than their release build.
agent-activity = "1.5.1"
agent-compose-ui = "1.4.3"
agent-coroutines = "1.6.4"
agent-gson = "2.8.6"
# The newest activity that builds with compileSdk 34, the oldest compileSdk sample-views checks
sample-views-activity = "1.9.3"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.13.0" }
agent-activity = { module = "androidx.activity:activity", version.ref = "agent-activity" }
agent-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "agent-compose-ui" }
agent-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "agent-coroutines" }
agent-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "agent-coroutines" }
agent-gson = { module = "com.google.code.gson:gson", version.ref = "agent-gson" }
sample-views-activity = { module = "androidx.activity:activity", version.ref = "sample-views-activity" }
androidx-test-core = { module = "androidx.test:core", version = "1.7.0" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
assertj = { module = "org.assertj:assertj-core", version = "3.27.7" }
compose-bom = { module = "androidx.compose:compose-bom", version = "2026.09.00" }
compose-material3 = { module = "androidx.compose.material3:material3" }
junit = { module = "junit:junit", version = "4.13.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
