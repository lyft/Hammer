[versions]
agp = "9.5.1"
kotlin = "2.4.21"
coroutines = "1.11.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.13.0" }
androidx-test-core = { module = "androidx.test:core", version = "1.7.0" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
compose-bom = { module = "androidx.compose:compose-bom", version = "2026.09.00" }
compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity = { module = "androidx.activity:activity", version = "1.13.0" }
androidx-core = { module = "androidx.core:core", version = "1.19.1" }
compose-ui = { module = "androidx.compose.ui:ui", version = "1.12.1" }
gson = { module = "com.google.code.gson:gson", version = "2.13.2" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version = "4.13.2" }
assertj = { module = "org.assertj:assertj-core", version = "3.24.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
