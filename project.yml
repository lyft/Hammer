name: Hammer
options:
  bundleIdPrefix: com.lyft
settings:
  SWIFT_VERSION: "6.0"
targets:
  Hammer:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources: Sources/Hammer
    scheme:
      testTargets:
        - HammerTests
      coverageTargets: 
        - Hammer
        - HammerAgent
      gatherCoverageData: true
  HammerAgentCore:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources: Sources/HammerAgentCore
    settings:
      GENERATE_INFOPLIST_FILE: YES
  HammerAgent:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources: Sources/HammerAgent
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Hammer
      - target: HammerAgentCore
  HammerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: Tests/HammerTests
    dependencies:
      - target: Hammer
      - target: HammerAgent
      - target: HammerAgentCore
      - target: TestHost
  TestHost:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: TestHost
