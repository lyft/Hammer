name: Release
on:
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      tag:
        description: The release to attach the hammer binary to, such as 2.2.0
        required: true
permissions:
  contents: write
jobs:
  build_system_helper:
    name: Build-System-Helper
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the system helper
        working-directory: android
        run: ./gradlew :hammer-system:assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: hammer-system
          path: android/hammer-system/build/outputs/apk/release/hammer-system-release.apk
          if-no-files-found: error
  upload_cli:
    name: Upload-CLI
    needs: build_system_helper
    runs-on: xcode-27
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: hammer-system
      - name: Embed the system helper
        run: bash scripts/embed-system-helper.sh hammer-system-release.apk
      - name: Force Xcode 27.0
        run: sudo xcode-select -switch /Applications/Xcode_27.0.app
      - name: Build hammer
        run: swift build -c release --product hammer --arch arm64 --arch x86_64
      - name: Package hammer
        run: |
          bin_path="$(swift build -c release --product hammer --arch arm64 --arch x86_64 --show-bin-path)"
          ditto -c -k --norsrc --noextattr "$bin_path/hammer" hammer-macos.zip
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" hammer-macos.zip --clobber
  upload_linux:
    name: Upload-Linux
    needs: build_system_helper
    runs-on: ubuntu-latest
    container: swift:6.4.2
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: hammer-system
      - name: Embed the system helper
        run: bash scripts/embed-system-helper.sh hammer-system-release.apk
      - name: Install the Static Linux SDK
        # It must match the container's Swift version; the checksum is the one swift.org publishes with it
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.4.2-release/static-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz \
            --checksum 3786b179936d9cc9e266dd506bd1654176358d7b25288e243359f4d17cc4dc5a
      - name: Build and package hammer
        # Statically linked against musl, so it runs on any Linux without Swift or its libraries
        run: |
          for arch in x86_64 aarch64; do
            swift build -c release --product hammer --swift-sdk "$arch-swift-linux-musl" -Xlinker -s
            bin_path="$(swift build -c release --product hammer --swift-sdk "$arch-swift-linux-musl" --show-bin-path)"
            tar -czf "hammer-linux-$arch.tar.gz" -C "$bin_path" hammer
          done
      - name: Install the GitHub CLI
        run: apt-get update && apt-get install -y gh
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release upload "$TAG" hammer-linux-x86_64.tar.gz hammer-linux-aarch64.tar.gz --clobber
  upload_android:
    name: Upload-Android
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build hammer-agent-android
        run: ./gradlew :hammer-agent:publishReleasePublicationToReleaseRepository -PVERSION_NAME="$TAG"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The POM lists the agent's dependencies, for apps that host the AAR in their own Maven repository
        run: gh release upload "$TAG" hammer-agent/build/release/com/lyft/hammer/hammer-agent-android/"$TAG"/hammer-agent-android-"$TAG".{aar,pom} --clobber
