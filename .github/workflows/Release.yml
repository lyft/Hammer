name: Release
on:
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      tag:
        description: The release to attach the hammer binary to, such as 2.2.0
        required: true
permissions:
  contents: write
jobs:
  upload_cli:
    name: Upload-CLI
    runs-on: xcode-27
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Force Xcode 27.0
        run: sudo xcode-select -switch /Applications/Xcode_27.0.app
      - name: Build hammer
        run: swift build -c release --product hammer --arch arm64 --arch x86_64
      - name: Package hammer
        run: |
          bin_path="$(swift build -c release --product hammer --arch arm64 --arch x86_64 --show-bin-path)"
          ditto -c -k --norsrc --noextattr "$bin_path/hammer" hammer-macos.zip
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" hammer-macos.zip --clobber
  upload_android:
    name: Upload-Android
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build hammer-agent-android
        run: ./gradlew :hammer-agent:publishReleasePublicationToReleaseRepository -PVERSION_NAME="$TAG"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The POM lists the agent's dependencies, for apps that host the AAR in their own Maven repository
        run: gh release upload "$TAG" hammer-agent/build/release/com/lyft/hammer/hammer-agent-android/"$TAG"/hammer-agent-android-"$TAG".{aar,pom} --clobber
