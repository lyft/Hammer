name: Test
on:
  pull_request:
jobs:
  trace_iphone_ios17:
    name: Trace-iPhone-iOS17
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Force Xcode 26.6
        run: sudo xcode-select -switch /Applications/Xcode_26.6.app
      - name: Make project
        run: make generate
      - name: Load simulators
        run: xcrun simctl list devices available
      - name: Install iOS 17 simulator
        run: |
          set -o pipefail
          xcodebuild -downloadPlatform iOS -buildVersion 17.5 | sed '/^Downloading/d'
      - name: Start load logging
        run: |
          mkdir -p build/trace
          sysctl -n hw.ncpu
          nohup bash -c 'while true; do echo "== $(date +%H:%M:%S) $(sysctl -n vm.loadavg)"; ps -A -o %cpu=,comm= | sort -rn | head -5; sleep 3; done' > build/trace/load.txt 2>&1 &
      - name: Boot the simulator
        run: |
          udid=$(xcrun simctl list devices "iOS 17.5" | grep -m1 "iPhone 15 (" | grep -oE "[0-9A-F-]{36}")
          echo "booting $udid at $(date +%H:%M:%S)"
          xcrun simctl boot "$udid"
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild -project Hammer.xcodeproj -scheme Hammer \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=17.5" \
            build-for-testing CODE_SIGNING_ALLOWED=NO | xcbeautify
      - name: Wait for the simulator to settle
        run: |
          echo "build done at $(date +%H:%M:%S), load $(sysctl -n vm.loadavg)"
          cpus=$(sysctl -n hw.ncpu)
          for _ in $(seq 1 120); do
            load=$(sysctl -n vm.loadavg | awk '{print int($2)}')
            echo "$(date +%H:%M:%S) load $load"
            if [ "$load" -le "$((cpus * 2))" ]; then
              break
            fi
            sleep 5
          done
      - name: Run the first tests three times on the same simulator
        run: |
          for run in 1 2 3; do
            if [ "$run" = 1 ]; then
              sample TestHost 45 5 -wait -mayDie -file build/trace/sample-run1.txt > build/trace/sample-run1.out 2>&1 &
            fi

            echo "::group::Run $run"
            xcodebuild -project Hammer.xcodeproj -scheme Hammer \
              -destination "platform=iOS Simulator,name=iPhone 15,OS=17.5" \
              -only-testing:HammerTests/DragTests -only-testing:HammerTests/HandTests \
              test-without-building CODE_SIGNING_ALLOWED=NO > "build/trace/run$run.log" 2>&1 || true
            grep -E "HAMMERTRACE|Test Case .*(passed|failed)|error:|Activating accessibility" "build/trace/run$run.log" \
              | sed -E 's/^.*HAMMERTRACE /TRACE /' | head -400
            echo "::endgroup::"
          done
          wait
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trace-iPhone-iOS17
          path: build/trace
